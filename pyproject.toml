[tool.poetry]
name = "scenorita-autoware"
version = "0.1.0"
description = ""
authors = ["S <shilonl2@uci.edu>"]
readme = "README.md"
packages = [{include = "src"}]

# NOTE: these are NOT installed with poetry any more. scenoRITA runs inside
# mozart_aw_052, where harness/ssv2/setup_container.sh pip-installs them against
# the image's Python -- it has to, because lanelet2 and the Autoware messages
# are only importable there and cannot be added to a virtualenv.
#
# Two pins in that script are load-bearing and are NOT expressible here:
# numpy<1.25 and scikit-learn==1.3.2. Unpinned, numpy 2.x is ABI-incompatible
# with the image's scipy and the ROS 2 bindings, and grading fails on every
# scenario while generation still works.
#
# This section is kept so the dependency set stays documented in one place, and
# for the host-side linting in main.sh.
[tool.poetry.dependencies]
python = ">=3.10,<3.12"
loguru = "^0.7.0"
absl-py = "^1.4.0"
numpy = ">=1.24.2,<1.25"  # see note above
pandas = "^2.0.0"
shapely = "^2.0.1"
matplotlib = "^3.7.1"
networkx = "^3.1"
nanoid = "^2.0.0"
deap = "^1.3.3"
scipy = "^1.10.1"
kneed = "^0.8.2"
scikit-learn = "1.3.2"  # see note above
pytest = "^8.0.0"
gdown = "^5.1.0"
mpld3 = "^0.5.10"


[tool.poetry.group.dev.dependencies]
mypy = "^1.2.0"
black = "^23.3.0"
isort = "^5.12.0"
ruff = "^0.0.261"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
ignore_missing_imports = true
exclude = ['modules', 'tests']

[tool.isort]
profile = "black"

[tool.ruff]
exclude = ['modules', 'tests']
